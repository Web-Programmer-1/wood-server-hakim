# Production overlay. Brings up Postgres, Redis, the API, and the worker
# behind a single `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`.
#
# Run from the project root, with .env.production sitting next to the compose
# files (it is loaded by the api/worker services via env_file).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: wood-api:latest
    container_name: wood-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Inside the docker network, services reach each other by service name.
      DATABASE_URL: postgresql://wood_dev:wood%2390%40serverdb@postgres:5432/wood_database?schema=public
      REDIS_URL: redis://redis:6379
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    image: wood-api:latest
    container_name: wood-worker
    restart: unless-stopped
    command: ["node", "dist/workerOnly.js"]
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://wood_dev:wood%2390%40serverdb@postgres:5432/wood_database?schema=public
      REDIS_URL: redis://redis:6379
      RUN_QUEUE_WORKER: "true"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
