

services:
  postgres:
    image: postgres:16-alpine
    container_name: wood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wood_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-wood_database}
    volumes:
      - wood_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wood_dev} -d ${POSTGRES_DB:-wood_database}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: wood-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - wood_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *log

  # One-shot: runs `prisma migrate deploy` and exits. The api waits for it
  # to complete successfully before starting (compose v2 condition).
  migrate:
    image: ${IMAGE:-ghcr.io/web-programmer-1/wood-server-hakim:latest}
    container_name: wood-migrate
    restart: "no"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/sbin/tini", "--"]
    command: ["npx", "prisma", "migrate", "deploy"]
    logging: *log

  api:
    image: ${IMAGE:-ghcr.io/web-programmer-1/wood-server-hakim:latest}
    container_name: wood-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Bind to localhost only — nginx on the host fronts the public traffic.
      - "127.0.0.1:4001:4000"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *log

  worker:
    image: ${IMAGE:-ghcr.io/web-programmer-1/wood-server-hakim:latest}
    container_name: wood-worker
    restart: unless-stopped
    command: ["node", "dist/workerOnly.js"]
    env_file:
      - .env.production
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RUN_QUEUE_WORKER: "true"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *log

volumes:
  wood_pgdata:
  wood_redisdata:
