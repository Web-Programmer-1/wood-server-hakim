name: Auto Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/wood-server-hakim
            git pull origin main

            export PATH=$PATH:/root/.local/share/pnpm:/usr/local/bin

            pnpm install
            pnpm build

            pnpm prisma migrate deploy

            pm2 restart wood-server || pm2 start dist/server.js --name "wood-server"
